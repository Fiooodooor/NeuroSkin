name: NeuroSkin Validation v3
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the supported single-manifest environment
        run: python -m pip install -r requirements.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Install browser-test tooling
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install chromium
      - name: Complete Python, Node, syntax and Chromium verification
        run: python verify_release.py --browser --out artifacts/release-verification.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-v3-verification
          path: artifacts/
  linux-cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Resolve the same supported manifest
        run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: CPU, archive and resource contracts
        run: python -m pytest -q tests/test_v3_unification.py tests/test_archive.py tests/test_compute_admission_v30.py tests/test_membrane_tile_v30.py tests/test_resource_telemetry_v30.py --junitxml=artifacts/linux-cpu.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-v3-cpu-verification
          path: artifacts/
